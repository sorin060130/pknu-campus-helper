<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>로그인 · 복지온</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="./styles.css"></head>
<body class="auth-page">
  <header class="site-header"><a class="brand" href="./index.html"><span class="brand-mark">온</span><span>복지온</span></a><a class="text-link" href="./index.html">홈으로 돌아가기 →</a></header>
  <main class="auth-main"><section class="auth-copy"><p class="eyebrow light">사회복지 서비스 플랫폼</p><h1>더 나은 서비스를 위한<br>관리자 로그인</h1><p>관리자는 로그인 후 공지사항을 신속하게 등록하고 관리할 수 있습니다.</p><div class="auth-quote">“필요한 순간, 가장 가까운 곳에서 힘이 되겠습니다.”</div></section>
  <section class="auth-card"><span class="brand-mark large">온</span><h2>다시 만나 반갑습니다</h2><p>관리자 계정으로 로그인해 주세요</p><form id="login-form"><label>이메일<input id="email" type="email" required autocomplete="email" placeholder="name@example.com"></label><label>비밀번호<input id="password" type="password" required autocomplete="current-password" placeholder="비밀번호를 입력하세요"></label><button class="button primary wide" type="submit">로그인</button><p id="login-message" class="form-message"></p></form><small>계정 생성과 권한 부여는 플랫폼 관리자가 담당합니다.</small></section></main>
  <script type="module" src="./login.js"></script>
</body></html>
