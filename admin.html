<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>공지 등록 · 복지온</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="./styles.css"></head>
<body>
  <header class="site-header"><a class="brand" href="./index.html"><span class="brand-mark">온</span><span>복지온 관리</span></a><button class="menu-button" aria-label="메뉴 열기">☰</button><nav class="nav"><a href="./index.html">홈</a><a href="./notices.html">공지사항 보기</a><a class="active" href="./admin.html">공지 등록</a><button class="nav-logout">로그아웃</button></nav></header>
  <main><section class="page-hero admin-hero"><p class="eyebrow">관리자 페이지</p><h1>공지사항 등록</h1><p id="admin-welcome">관리자 권한을 확인하는 중입니다...</p></section>
  <section class="section admin-layout"><form id="notice-form" class="editor-card hidden"><div class="editor-heading"><div><h2>새 공지사항</h2><p>새로운 서비스 공지사항을 작성하고 등록합니다.</p></div><span class="status-dot">작성 중</span></div><label>공지 제목<input id="title" maxlength="80" required placeholder="명확하고 간결한 공지 제목을 입력하세요"></label><div class="form-row"><label>공지 분류<select id="category"><option>서비스 안내</option><option>정책 변경</option><option>행사 안내</option><option>중요 알림</option></select></label><label>담당 기관<input id="department" required value="복지온 사회복지서비스센터"></label></div><label>공지 내용<textarea id="content" rows="10" required placeholder="공지사항의 자세한 내용을 입력하세요..."></textarea></label><label class="check-label"><input id="pinned" type="checkbox"> 상단 고정 공지로 등록</label><div class="form-actions"><button type="reset" class="button secondary">내용 지우기</button><button type="submit" class="button primary">공지 등록 <span>→</span></button></div><p id="publish-message" class="form-message"></p></form><div id="access-message" class="access-card"><div class="loader"></div><h3>권한 확인 중</h3><p>잠시만 기다려 주세요...</p></div></section></main>
  <script type="module" src="./admin.js"></script>
</body></html>
