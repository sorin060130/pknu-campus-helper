<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>发布公告 · 福邻</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="./styles.css"></head>
<body>
  <header class="site-header"><a class="brand" href="./index.html"><span class="brand-mark">福</span><span>福邻管理台</span></a><button class="menu-button" aria-label="打开导航">☰</button><nav class="nav"><a href="./index.html">首页</a><a href="./notices.html">查看公告</a><a class="active" href="./admin.html">发布公告</a><button class="nav-logout">退出</button></nav></header>
  <main><section class="page-hero admin-hero"><p class="eyebrow">管理员工作台</p><h1>发布公告</h1><p id="admin-welcome">正在验证管理员权限...</p></section>
  <section class="section admin-layout"><form id="notice-form" class="editor-card hidden"><div class="editor-heading"><div><h2>新建公告</h2><p>填写并发布一条新的服务公告。</p></div><span class="status-dot">草稿</span></div><label>公告标题<input id="title" maxlength="80" required placeholder="请输入清晰、简洁的公告标题"></label><div class="form-row"><label>公告分类<select id="category"><option>服务通知</option><option>政策更新</option><option>活动安排</option><option>重要提醒</option></select></label><label>发布单位<input id="department" required value="福邻社会福祉服务中心"></label></div><label>公告内容<textarea id="content" rows="10" required placeholder="请输入公告详细内容..."></textarea></label><label class="check-label"><input id="pinned" type="checkbox"> 设为置顶公告</label><div class="form-actions"><button type="reset" class="button secondary">清空内容</button><button type="submit" class="button primary">立即发布 <span>→</span></button></div><p id="publish-message" class="form-message"></p></form><div id="access-message" class="access-card"><div class="loader"></div><h3>正在验证权限</h3><p>请稍候...</p></div></section></main>
  <script type="module" src="./admin.js"></script>
</body></html>
